services:
  db:
    image: postgres:15-alpine
    container_name: pg-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mongo-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mydb
    volumes:
      - mongodata:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: nest-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MONGO_URI: mongodb://user:password@mongo:27017/mydb?authSource=admin
      PORT: 6001
    ports:
      - "6001:6001"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: next-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:6001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
